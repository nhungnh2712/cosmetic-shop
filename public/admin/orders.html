<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Đơn Hàng - GlowShop Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-spa me-2"></i>GlowShop Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="/admin/products.html" class="nav-item"><i class="fas fa-box"></i> Sản phẩm</a>
      <a href="/admin/orders.html" class="nav-item active"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
      <a href="/admin/customers.html" class="nav-item"><i class="fas fa-users"></i> Khách hàng</a>
      <a href="/" class="nav-item"><i class="fas fa-store"></i> Xem cửa hàng</a>
      <a href="#" class="nav-item text-danger" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h4 class="mb-0">Quản Lý Đơn Hàng</h4>
    </div>

    <div class="p-4">
      <!-- Filter -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <input type="text" class="form-control" id="searchOrder" placeholder="🔍 Tìm theo tên, SĐT..." oninput="filterOrders()">
            </div>
            <div class="col-md-3">
              <select class="form-select" id="statusFilter" onchange="filterOrders()">
                <option value="">Tất cả trạng thái</option>
                <option value="pending">Chờ xác nhận</option>
                <option value="processing">Đang xử lý</option>
                <option value="shipped">Đang giao</option>
                <option value="delivered">Đã giao</option>
                <option value="cancelled">Đã hủy</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>SĐT</th>
                  <th>Sản phẩm</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th>Ngày đặt</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="ordersTable">
                <tr><td colspan="8" class="text-center py-4"><div class="spinner-border" style="color:#e91e8c"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Chi tiết đơn hàng</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderDetail"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const fmt = (n) => new Intl.NumberFormat('vi-VN').format(n) + 'đ';
let allOrders = [];

const statusLabel = {
  pending: '<span class="badge" style="background:#fef3c7;color:#f59e0b;font-size:0.8rem">⏳ Chờ xác nhận</span>',
  processing: '<span class="badge" style="background:#dbeafe;color:#3b82f6;font-size:0.8rem">🔄 Đang xử lý</span>',
  shipped: '<span class="badge" style="background:#ede9fe;color:#8b5cf6;font-size:0.8rem">🚚 Đang giao</span>',
  delivered: '<span class="badge" style="background:#d1fae5;color:#10b981;font-size:0.8rem">✅ Đã giao</span>',
  cancelled: '<span class="badge" style="background:#fee2e2;color:#ef4444;font-size:0.8rem">❌ Đã hủy</span>'
};

async function checkAdmin() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user || data.user.role !== 'admin') window.location.href = '/login.html';
}

async function loadOrders() {
  const res = await fetch('/api/admin/orders');
  allOrders = await res.json();
  renderTable(allOrders);
}

function renderTable(orders) {
  document.getElementById('ordersTable').innerHTML = orders.length === 0
    ? '<tr><td colspan="8" class="text-center py-4 text-muted">Không có đơn hàng</td></tr>'
    : orders.map(o => `
      <tr>
        <td><strong>#${o.id}</strong></td>
        <td>${o.user_name || o.name}</td>
        <td>${o.phone || '-'}</td>
        <td><small class="text-muted">${o.items.length} sản phẩm</small></td>
        <td style="color:#e91e8c;font-weight:600">${fmt(o.total)}</td>
        <td>${statusLabel[o.status] || o.status}</td>
        <td>${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i></button>
          <select class="form-select form-select-sm d-inline-block" style="width:auto" onchange="updateStatus(${o.id}, this.value)">
            <option value="pending" ${o.status==='pending'?'selected':''}>Chờ xác nhận</option>
            <option value="processing" ${o.status==='processing'?'selected':''}>Đang xử lý</option>
            <option value="shipped" ${o.status==='shipped'?'selected':''}>Đang giao</option>
            <option value="delivered" ${o.status==='delivered'?'selected':''}>Đã giao</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Đã hủy</option>
          </select>
        </td>
      </tr>`).join('');
}

function filterOrders() {
  const q = document.getElementById('searchOrder').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  renderTable(allOrders.filter(o =>
    (!q || (o.name||'').toLowerCase().includes(q) || (o.phone||'').includes(q) || (o.user_name||'').toLowerCase().includes(q)) &&
    (!status || o.status === status)
  ));
}

function viewOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  document.getElementById('orderDetail').innerHTML = `
    <div class="row g-3">
      <div class="col-md-6">
        <h6 class="fw-bold">Thông tin khách hàng</h6>
        <p class="mb-1"><strong>Tên:</strong> ${o.name}</p>
        <p class="mb-1"><strong>SĐT:</strong> ${o.phone}</p>
        <p class="mb-1"><strong>Địa chỉ:</strong> ${o.address}</p>
        ${o.note ? `<p class="mb-1"><strong>Ghi chú:</strong> ${o.note}</p>` : ''}
      </div>
      <div class="col-md-6">
        <h6 class="fw-bold">Thông tin đơn hàng</h6>
        <p class="mb-1"><strong>Mã đơn:</strong> #${o.id}</p>
        <p class="mb-1"><strong>Ngày đặt:</strong> ${new Date(o.created_at).toLocaleString('vi-VN')}</p>
        <p class="mb-1"><strong>Trạng thái:</strong> ${statusLabel[o.status]}</p>
      </div>
      <div class="col-12">
        <h6 class="fw-bold">Sản phẩm</h6>
        <table class="table table-sm">
          <thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>SL</th><th>Thành tiền</th></tr></thead>
          <tbody>
            ${o.items.map(i => `<tr><td>${i.name}</td><td>${fmt(i.price)}</td><td>${i.quantity}</td><td>${fmt(i.price*i.quantity)}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><td colspan="3" class="text-end fw-bold">Tổng cộng:</td><td style="color:#e91e8c;font-weight:700">${fmt(o.total)}</td></tr></tfoot>
        </table>
      </div>
    </div>`;
  new bootstrap.Modal(document.getElementById('orderModal')).show();
}

async function updateStatus(id, status) {
  await fetch(`/api/admin/orders/${id}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  const order = allOrders.find(o => o.id === id);
  if (order) order.status = status;
}

async function adminLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

checkAdmin();
loadOrders();
</script>
</body>
</html>
