<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-spa me-2"></i>GlowShop Admin
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/index.html" class="nav-item active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="/admin/products.html" class="nav-item"><i class="fas fa-box"></i> Sản phẩm</a>
      <a href="/admin/orders.html" class="nav-item"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
      <a href="/" class="nav-item"><i class="fas fa-store"></i> Xem cửa hàng</a>
      <a href="#" class="nav-item text-danger" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </nav>
  </div>

  <!-- MAIN -->
  <div class="main-content">
    <div class="top-bar">
      <h4 class="mb-0">Dashboard</h4>
      <span id="adminName" class="text-muted"></span>
    </div>

    <div class="p-4">
      <!-- STATS -->
      <div class="row g-4 mb-4">
        <div class="col-6 col-md-3">
          <div class="stat-card" style="border-left:4px solid #e91e8c">
            <div class="stat-icon" style="background:#fce4ec;color:#e91e8c"><i class="fas fa-box"></i></div>
            <div>
              <p class="stat-label">Sản phẩm</p>
              <h3 class="stat-value" id="statProducts">-</h3>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" style="border-left:4px solid #3b82f6">
            <div class="stat-icon" style="background:#dbeafe;color:#3b82f6"><i class="fas fa-shopping-bag"></i></div>
            <div>
              <p class="stat-label">Đơn hàng</p>
              <h3 class="stat-value" id="statOrders">-</h3>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" style="border-left:4px solid #10b981">
            <div class="stat-icon" style="background:#d1fae5;color:#10b981"><i class="fas fa-users"></i></div>
            <div>
              <p class="stat-label">Khách hàng</p>
              <h3 class="stat-value" id="statUsers">-</h3>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card" style="border-left:4px solid #f59e0b">
            <div class="stat-icon" style="background:#fef3c7;color:#f59e0b"><i class="fas fa-dollar-sign"></i></div>
            <div>
              <p class="stat-label">Doanh thu</p>
              <h3 class="stat-value" id="statRevenue">-</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- RECENT ORDERS -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Đơn hàng gần đây</h5>
          <a href="/admin/orders.html" class="btn btn-sm btn-outline-primary">Xem tất cả</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th>Ngày đặt</th>
                </tr>
              </thead>
              <tbody id="recentOrders"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const fmt = (n) => new Intl.NumberFormat('vi-VN').format(n) + 'đ';
const statusLabel = {
  pending: '<span class="badge" style="background:#fef3c7;color:#f59e0b">Chờ xác nhận</span>',
  processing: '<span class="badge" style="background:#dbeafe;color:#3b82f6">Đang xử lý</span>',
  shipped: '<span class="badge" style="background:#ede9fe;color:#8b5cf6">Đang giao</span>',
  delivered: '<span class="badge" style="background:#d1fae5;color:#10b981">Đã giao</span>',
  cancelled: '<span class="badge" style="background:#fee2e2;color:#ef4444">Đã hủy</span>'
};

async function checkAdmin() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user || data.user.role !== 'admin') { window.location.href = '/login.html'; return; }
  document.getElementById('adminName').textContent = '👤 ' + data.user.name;
}

async function loadStats() {
  const res = await fetch('/api/admin/stats');
  const data = await res.json();
  document.getElementById('statProducts').textContent = data.totalProducts;
  document.getElementById('statOrders').textContent = data.totalOrders;
  document.getElementById('statUsers').textContent = data.totalUsers;
  document.getElementById('statRevenue').textContent = fmt(data.totalRevenue);

  document.getElementById('recentOrders').innerHTML = data.recentOrders.map(o => `
    <tr>
      <td><strong>#${o.id}</strong></td>
      <td>${o.user_name || o.name}</td>
      <td style="color:#e91e8c;font-weight:600">${fmt(o.total)}</td>
      <td>${statusLabel[o.status] || o.status}</td>
      <td>${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
    </tr>`).join('');
}

async function adminLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

checkAdmin();
loadStats();
</script>
</body>
</html>
