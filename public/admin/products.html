<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sản Phẩm - GlowShop Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-spa me-2"></i>GlowShop Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="/admin/products.html" class="nav-item active"><i class="fas fa-box"></i> Sản phẩm</a>
      <a href="/admin/orders.html" class="nav-item"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
      <a href="/" class="nav-item"><i class="fas fa-store"></i> Xem cửa hàng</a>
      <a href="#" class="nav-item text-danger" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h4 class="mb-0">Quản Lý Sản Phẩm</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAdd()">
        <i class="fas fa-plus me-2"></i>Thêm sản phẩm
      </button>
    </div>

    <div class="p-4">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white">
          <input type="text" class="form-control" id="searchProd" placeholder="🔍 Tìm kiếm sản phẩm..." style="max-width:300px" oninput="filterProducts()">
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Ảnh</th>
                  <th>Tên sản phẩm</th>
                  <th>Danh mục</th>
                  <th>Giá</th>
                  <th>Giá KM</th>
                  <th>Tồn kho</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="productsTable">
                <tr><td colspan="7" class="text-center py-4"><div class="spinner-border" style="color:#e91e8c"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm sản phẩm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="productForm" enctype="multipart/form-data">
          <input type="hidden" id="productId">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold">Tên sản phẩm *</label>
              <input type="text" class="form-control" id="pName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Thương hiệu</label>
              <input type="text" class="form-control" id="pBrand">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Danh mục *</label>
              <select class="form-select" id="pCategory" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Giá gốc (đ) *</label>
              <input type="number" class="form-control" id="pPrice" min="0" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Giá khuyến mãi (đ)</label>
              <input type="number" class="form-control" id="pSalePrice" min="0" placeholder="Để trống nếu không KM">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Tồn kho *</label>
              <input type="number" class="form-control" id="pStock" min="0" required>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">Ảnh sản phẩm</label>
              <input type="file" class="form-control" id="pImage" accept="image/*" onchange="previewImg(this)">
              <img id="imgPreview" src="" class="mt-2 rounded" style="max-height:100px;display:none">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Mô tả</label>
              <textarea class="form-control" id="pDesc" rows="3"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-primary" onclick="saveProduct()" id="saveBtn">
          <i class="fas fa-save me-2"></i>Lưu
        </button>
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#ef4444">
        <h5 class="modal-title text-white">Xác nhận xóa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">Bạn có chắc muốn xóa sản phẩm này không?</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Xóa</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const fmt = (n) => new Intl.NumberFormat('vi-VN').format(n) + 'đ';
let allProducts = [];
let deleteId = null;

async function checkAdmin() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user || data.user.role !== 'admin') window.location.href = '/login.html';
}

async function loadCategories() {
  const res = await fetch('/api/categories');
  const cats = await res.json();
  document.getElementById('pCategory').innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

async function loadProducts() {
  const res = await fetch('/api/admin/products');
  allProducts = await res.json();
  renderTable(allProducts);
}

function renderTable(products) {
  document.getElementById('productsTable').innerHTML = products.length === 0
    ? '<tr><td colspan="7" class="text-center py-4 text-muted">Không có sản phẩm</td></tr>'
    : products.map(p => `
      <tr>
        <td><img src="${p.image && p.image.startsWith('http') ? p.image : '/images/products/' + p.image}" style="width:50px;height:50px;object-fit:cover;border-radius:8px"
          onerror="this.src='https://placehold.co/50x50/fce4ec/e91e8c?text=SP'"></td>
        <td><strong>${p.name}</strong><br><small class="text-muted">${p.brand||''}</small></td>
        <td>${p.category_name||'-'}</td>
        <td>${fmt(p.price)}</td>
        <td>${p.sale_price ? `<span style="color:#e91e8c;font-weight:600">${fmt(p.sale_price)}</span>` : '<span class="text-muted">-</span>'}</td>
        <td><span class="${p.stock > 0 ? 'text-success' : 'text-danger'} fw-semibold">${p.stock}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit(${p.id})"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="openDelete(${p.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`).join('');
}

function filterProducts() {
  const q = document.getElementById('searchProd').value.toLowerCase();
  renderTable(allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q)));
}

function openAdd() {
  document.getElementById('modalTitle').textContent = 'Thêm sản phẩm';
  document.getElementById('productId').value = '';
  document.getElementById('productForm').reset();
  document.getElementById('imgPreview').style.display = 'none';
}

function openEdit(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalTitle').textContent = 'Sửa sản phẩm';
  document.getElementById('productId').value = p.id;
  document.getElementById('pName').value = p.name;
  document.getElementById('pBrand').value = p.brand || '';
  document.getElementById('pCategory').value = p.category_id;
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pSalePrice').value = p.sale_price || '';
  document.getElementById('pStock').value = p.stock;
  document.getElementById('pDesc').value = p.description || '';
  document.getElementById('imgPreview').src = '/images/products/' + p.image;
  document.getElementById('imgPreview').style.display = 'block';
  new bootstrap.Modal(document.getElementById('productModal')).show();
}

function previewImg(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('imgPreview').src = e.target.result;
      document.getElementById('imgPreview').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function saveProduct() {
  const id = document.getElementById('productId').value;
  const formData = new FormData();
  formData.append('name', document.getElementById('pName').value);
  formData.append('brand', document.getElementById('pBrand').value);
  formData.append('category_id', document.getElementById('pCategory').value);
  formData.append('price', document.getElementById('pPrice').value);
  formData.append('sale_price', document.getElementById('pSalePrice').value);
  formData.append('stock', document.getElementById('pStock').value);
  formData.append('description', document.getElementById('pDesc').value);
  const imgFile = document.getElementById('pImage').files[0];
  if (imgFile) formData.append('image', imgFile);

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;

  const url = id ? `/api/admin/products/${id}` : '/api/admin/products';
  const method = id ? 'PUT' : 'POST';
  const res = await fetch(url, { method, body: formData });
  const data = await res.json();

  if (data.success) {
    bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
    loadProducts();
  }
  btn.disabled = false;
}

function openDelete(id) {
  deleteId = id;
  new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

async function confirmDelete() {
  await fetch('/api/admin/products/' + deleteId, { method: 'DELETE' });
  bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
  loadProducts();
}

async function adminLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

checkAdmin();
loadCategories();
loadProducts();
</script>
</body>
</html>
