<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-spa me-2"></i>Glow<span>Shop</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products.html">Sản phẩm</a></li>
      </ul>
      <ul class="navbar-nav align-items-center">
        <li class="nav-item">
          <a class="nav-link position-relative" href="/cart.html">
            <i class="fas fa-shopping-cart fa-lg"></i>
            <span class="cart-badge" id="cartCount">0</span>
          </a>
        </li>
        <ul class="navbar-nav" id="navAuth"></ul>
      </ul>
    </div>
  </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="container py-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
      <li class="breadcrumb-item active">Giỏ hàng</li>
    </ol>
  </nav>
  <h2 class="section-title mb-4">Giỏ Hàng</h2>

  <div class="row g-4">
    <div class="col-lg-8" id="cartItems">
      <div class="text-center py-5"><div class="spinner-border" style="color:var(--primary)"></div></div>
    </div>
    <div class="col-lg-4">
      <div class="cart-summary">
        <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>
        <div class="d-flex justify-content-between mb-2">
          <span>Tạm tính:</span><span id="subtotal">0đ</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Phí vận chuyển:</span><span class="text-success">Miễn phí</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
          <span>Tổng cộng:</span><span style="color:var(--primary)" id="total">0đ</span>
        </div>
        <a href="/checkout.html" class="btn btn-primary w-100 btn-lg mb-2" id="checkoutBtn">
          <i class="fas fa-credit-card me-2"></i>Thanh toán
        </a>
        <a href="/products.html" class="btn btn-outline-secondary w-100">
          <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
        </a>
      </div>
    </div>
  </div>
</div>

<footer class="py-4" style="background:var(--dark);color:#ccc">
  <div class="container text-center"><p class="mb-0">© 2024 GlowShop. All rights reserved.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
async function loadCart() {
  const res = await fetch('/api/cart');
  const items = await res.json();

  if (items.length === 0) {
    document.getElementById('cartItems').innerHTML = `
      <div class="empty-state">
        <i class="fas fa-shopping-cart"></i>
        <h5>Giỏ hàng trống</h5>
        <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng</p>
        <a href="/products.html" class="btn btn-primary mt-2">Mua sắm ngay</a>
      </div>`;
    document.getElementById('subtotal').textContent = '0đ';
    document.getElementById('total').textContent = '0đ';
    document.getElementById('checkoutBtn').classList.add('disabled');
    return;
  }

  let subtotal = 0;
  document.getElementById('cartItems').innerHTML = items.map(item => {
    const p = item.product;
    const price = p.sale_price || p.price;
    const itemTotal = price * item.quantity;
    subtotal += itemTotal;
    return `
      <div class="cart-item d-flex gap-3 align-items-center" id="item_${p.id}">
        <img src="/images/products/${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/80x80/fce4ec/e91e8c?text=SP'">
        <div class="flex-grow-1">
          <h6 class="mb-1"><a href="/product.html?id=${p.id}" class="text-decoration-none text-dark">${p.name}</a></h6>
          <p class="text-muted mb-1" style="font-size:0.85rem">${p.brand||''}</p>
          <span style="color:var(--primary);font-weight:700">${fmt(price)}</span>
          ${p.sale_price ? `<span class="text-muted text-decoration-line-through ms-2" style="font-size:0.85rem">${fmt(p.price)}</span>` : ''}
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group" style="width:110px">
            <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${p.id}, ${item.quantity-1})">-</button>
            <input type="number" class="form-control form-control-sm text-center" value="${item.quantity}" min="1"
              onchange="updateQty(${p.id}, this.value)" style="width:40px">
            <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${p.id}, ${item.quantity+1})">+</button>
          </div>
          <span class="fw-bold" style="min-width:90px;text-align:right">${fmt(itemTotal)}</span>
          <button class="btn btn-sm text-danger" onclick="removeItem(${p.id})"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('subtotal').textContent = fmt(subtotal);
  document.getElementById('total').textContent = fmt(subtotal);
}

async function updateQty(productId, qty) {
  qty = parseInt(qty);
  const res = await fetch('/api/cart/' + productId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ quantity: qty })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById('cartCount').textContent = data.count;
    loadCart();
  }
}

async function removeItem(productId) {
  const res = await fetch('/api/cart/' + productId, { method: 'DELETE' });
  const data = await res.json();
  if (data.success) {
    document.getElementById('cartCount').textContent = data.count;
    showToast('Đã xóa sản phẩm', 'info');
    loadCart();
  }
}

loadCart();
</script>
</body>
</html>
