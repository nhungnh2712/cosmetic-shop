<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Sản Phẩm - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-spa me-2"></i>Glow<span>Shop</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products.html">Sản phẩm</a></li>
      </ul>
      <ul class="navbar-nav align-items-center">
        <li class="nav-item">
          <a class="nav-link position-relative" href="/cart.html">
            <i class="fas fa-shopping-cart fa-lg"></i>
            <span class="cart-badge" id="cartCount">0</span>
          </a>
        </li>
        <ul class="navbar-nav" id="navAuth"></ul>
      </ul>
    </div>
  </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="container py-5" id="productDetail">
  <div class="text-center py-5"><div class="spinner-border" style="color:var(--primary)"></div></div>
</div>

<!-- Related products -->
<div class="container pb-5">
  <h4 class="section-title mb-4">Sản Phẩm Liên Quan</h4>
  <div class="row g-4" id="relatedProducts"></div>
</div>

<footer class="py-4" style="background:var(--dark);color:#ccc">
  <div class="container text-center"><p class="mb-0">© 2024 GlowShop. All rights reserved.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');
if (!id) window.location.href = '/products.html';

async function loadProduct() {
  const res = await fetch('/api/products/' + id);
  if (!res.ok) { window.location.href = '/products.html'; return; }
  const p = await res.json();

  document.title = p.name + ' - GlowShop';
  const price = p.sale_price
    ? `<span class="price">${fmt(p.sale_price)}</span> <span class="price-original ms-2">${fmt(p.price)}</span>
       <span class="badge ms-2" style="background:var(--primary)">-${Math.round((1-p.sale_price/p.price)*100)}%</span>`
    : `<span class="price">${fmt(p.price)}</span>`;

  document.getElementById('productDetail').innerHTML = `
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
        <li class="breadcrumb-item"><a href="/products.html">Sản phẩm</a></li>
        <li class="breadcrumb-item active">${p.name}</li>
      </ol>
    </nav>
    <div class="row g-5">
      <div class="col-md-5">
        <img src="${getImg(p.image)}" class="product-detail-img" alt="${p.name}"
          onerror="this.src='https://placehold.co/500x450/fce4ec/e91e8c?text=My+Pham'">
      </div>
      <div class="col-md-7 product-detail">
        <p class="text-muted mb-1"><i class="fas fa-tag me-1"></i>${p.category_name || 'Mỹ phẩm'}</p>
        <h2 class="fw-bold mb-2">${p.name}</h2>
        <p class="mb-1"><strong>Thương hiệu:</strong> <span class="text-primary" style="color:var(--primary)!important">${p.brand || 'N/A'}</span></p>
        <div class="mb-3">⭐⭐⭐⭐⭐ <span class="text-muted">(128 đánh giá)</span></div>
        <div class="mb-4">${price}</div>
        <p class="mb-4 text-muted">${p.description || 'Sản phẩm mỹ phẩm chất lượng cao, phù hợp cho mọi loại da.'}</p>
        <div class="mb-3">
          <span class="${p.stock > 0 ? 'text-success' : 'text-danger'}">
            <i class="fas fa-${p.stock > 0 ? 'check-circle' : 'times-circle'} me-1"></i>
            ${p.stock > 0 ? `Còn hàng (${p.stock} sản phẩm)` : 'Hết hàng'}
          </span>
        </div>
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="input-group" style="width:130px">
            <button class="btn btn-outline-secondary" onclick="changeQty(-1)">-</button>
            <input type="number" class="form-control qty-input" id="qty" value="1" min="1" max="${p.stock}">
            <button class="btn btn-outline-secondary" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn btn-primary btn-lg flex-grow-1" onclick="addToCartDetail(${p.id})" ${p.stock===0?'disabled':''}>
            <i class="fas fa-cart-plus me-2"></i>Thêm vào giỏ hàng
          </button>
        </div>
        <a href="/cart.html" class="btn btn-outline-primary w-100" onclick="addToCartDetail(${p.id})">
          <i class="fas fa-bolt me-2"></i>Mua ngay
        </a>
        <div class="mt-4 p-3 rounded" style="background:var(--light-gray)">
          <div class="row text-center g-2">
            <div class="col-4"><i class="fas fa-shield-alt" style="color:var(--primary)"></i><br><small>Hàng chính hãng</small></div>
            <div class="col-4"><i class="fas fa-truck" style="color:var(--primary)"></i><br><small>Giao hàng nhanh</small></div>
            <div class="col-4"><i class="fas fa-undo" style="color:var(--primary)"></i><br><small>Đổi trả 30 ngày</small></div>
          </div>
        </div>
      </div>
    </div>`;

  // Load related
  const relRes = await fetch(`/api/products?limit=4`);
  const relData = await relRes.json();
  const related = relData.products.filter(r => r.id != id).slice(0, 4);
  document.getElementById('relatedProducts').innerHTML = related.map(r => {
    const rPrice = r.sale_price ? `<span class="price">${fmt(r.sale_price)}</span> <span class="price-original">${fmt(r.price)}</span>` : `<span class="price">${fmt(r.price)}</span>`;
    return `
      <div class="col-6 col-md-3">
        <div class="product-card card h-100">
          <img src="${getImg(r.image)}" class="card-img-top" alt="${r.name}" onerror="this.src='https://via.placeholder.com/300x220/fce4ec/e91e8c?text=Mỹ+Phẩm'" style="height:180px;object-fit:cover">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title flex-grow-1"><a href="/product.html?id=${r.id}" class="text-decoration-none text-dark">${r.name}</a></h6>
            <div class="mb-2">${rPrice}</div>
            <button class="btn-cart" onclick="addToCart(${r.id})"><i class="fas fa-cart-plus me-1"></i>Thêm vào giỏ</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function changeQty(delta) {
  const input = document.getElementById('qty');
  const newVal = Math.max(1, parseInt(input.value) + delta);
  input.value = newVal;
}

async function addToCartDetail(productId) {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  const res = await fetch('/api/cart', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ productId, quantity: qty })
  });
  const data = await res.json();
  if (data.success) {
    showToast('Đã thêm vào giỏ hàng');
    document.getElementById('cartCount').textContent = data.count;
  }
}

loadProduct();
</script>
</body>
</html>
