<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#fce4ec,#f8bbd9,#fce4ec);min-height:100vh">

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-spa me-2"></i>Glow<span>Shop</span></a>
  </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="fas fa-spa fa-3x mb-3" style="color:var(--primary)"></i>
      <h2>Đăng Nhập</h2>
      <p class="text-muted">Chào mừng bạn quay lại GlowShop</p>
    </div>

    <div id="errorMsg" class="alert alert-danger d-none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope" style="color:var(--primary)"></i></span>
          <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock" style="color:var(--primary)"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="loginBtn">
        <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted">Chưa có tài khoản? <a href="/register.html" style="color:var(--primary);font-weight:600">Đăng ký ngay</a></p>
      <hr>
      <p class="text-muted small">Demo admin: <strong>admin@gmail.com</strong> / <strong>admin123</strong></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
function togglePwd() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { pwd.type = 'password'; icon.className = 'fas fa-eye'; }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();

  if (data.success) {
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      window.location.href = redirect;
    } else if (data.user.role === 'admin') {
      window.location.href = '/admin/index.html';
    } else {
      window.location.href = '/';
    }
  } else {
    document.getElementById('errorMsg').textContent = data.message;
    document.getElementById('errorMsg').classList.remove('d-none');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
  }
});

// Redirect if already logged in
checkAuth().then(user => {
  if (user) {
    window.location.href = user.role === 'admin' ? '/admin/index.html' : '/';
  }
});
</script>
</body>
</html>
