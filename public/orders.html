<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn Hàng Của Tôi - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-spa me-2"></i>Glow<span>Shop</span></a>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item">
        <a class="nav-link position-relative" href="/cart.html">
          <i class="fas fa-shopping-cart fa-lg"></i>
          <span class="cart-badge" id="cartCount">0</span>
        </a>
      </li>
      <ul class="navbar-nav" id="navAuth"></ul>
    </ul>
  </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="container py-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
      <li class="breadcrumb-item active">Đơn hàng của tôi</li>
    </ol>
  </nav>
  <h2 class="section-title mb-4">📦 Đơn Hàng Của Tôi</h2>
  <div id="ordersList">
    <div class="text-center py-5"><div class="spinner-border" style="color:var(--primary)"></div></div>
  </div>
</div>

<footer class="py-4" style="background:var(--dark);color:#ccc">
  <div class="container text-center"><p class="mb-0">© 2024 GlowShop. All rights reserved.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
const statusLabel = {
  pending: '<span class="status-pending">⏳ Chờ xác nhận</span>',
  processing: '<span class="status-processing">🔄 Đang xử lý</span>',
  shipped: '<span class="status-shipped">🚚 Đang giao</span>',
  delivered: '<span class="status-delivered">✅ Đã giao</span>',
  cancelled: '<span class="status-cancelled">❌ Đã hủy</span>'
};

async function loadOrders() {
  const user = await checkAuth();
  if (!user) { window.location.href = '/login.html'; return; }

  const res = await fetch('/api/orders/my');
  const orders = await res.json();

  if (orders.length === 0) {
    document.getElementById('ordersList').innerHTML = `
      <div class="empty-state">
        <i class="fas fa-box-open"></i>
        <h5>Chưa có đơn hàng nào</h5>
        <p class="text-muted">Hãy mua sắm và đặt hàng ngay</p>
        <a href="/products.html" class="btn btn-primary mt-2">Mua sắm ngay</a>
      </div>`;
    return;
  }

  document.getElementById('ordersList').innerHTML = orders.map(order => `
    <div class="card mb-4 border-0 shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center" style="background:var(--light-gray)">
        <div>
          <strong>Đơn hàng #${order.id}</strong>
          <span class="text-muted ms-3" style="font-size:0.85rem">${new Date(order.created_at).toLocaleDateString('vi-VN')}</span>
        </div>
        ${statusLabel[order.status] || order.status}
      </div>
      <div class="card-body">
        <div class="row g-3 mb-3">
          ${order.items.map(item => `
            <div class="col-12">
              <div class="d-flex align-items-center gap-3">
                <img src="/images/products/${item.image}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"
                  onerror="this.src='https://via.placeholder.com/60x60/fce4ec/e91e8c?text=SP'">
                <div class="flex-grow-1">
                  <p class="mb-0 fw-semibold">${item.name}</p>
                  <small class="text-muted">x${item.quantity} × ${fmt(item.price)}</small>
                </div>
                <span class="fw-bold">${fmt(item.price * item.quantity)}</span>
              </div>
            </div>`).join('')}
        </div>
        <hr>
        <div class="row">
          <div class="col-md-6">
            <p class="mb-1"><i class="fas fa-user me-2" style="color:var(--primary)"></i><strong>${order.name}</strong></p>
            <p class="mb-1"><i class="fas fa-phone me-2" style="color:var(--primary)"></i>${order.phone}</p>
            <p class="mb-0"><i class="fas fa-map-marker-alt me-2" style="color:var(--primary)"></i>${order.address}</p>
          </div>
          <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <p class="mb-1 text-muted">Tổng thanh toán:</p>
            <p class="fs-5 fw-bold mb-0" style="color:var(--primary)">${fmt(order.total)}</p>
          </div>
        </div>
      </div>
    </div>`).join('');
}

loadOrders();
</script>
</body>
</html>
