<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký - GlowShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#fce4ec,#f8bbd9,#fce4ec);min-height:100vh">

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="fas fa-spa me-2"></i>Glow<span>Shop</span></a>
  </div>
</nav>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="fas fa-user-plus fa-3x mb-3" style="color:var(--primary)"></i>
      <h2>Đăng Ký</h2>
      <p class="text-muted">Tạo tài khoản để mua sắm dễ dàng hơn</p>
    </div>

    <div id="errorMsg" class="alert alert-danger d-none"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Họ và tên</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user" style="color:var(--primary)"></i></span>
          <input type="text" class="form-control" id="name" placeholder="Nguyễn Văn A" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope" style="color:var(--primary)"></i></span>
          <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock" style="color:var(--primary)"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Ít nhất 6 ký tự" required minlength="6">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('password','eye1')"><i class="fas fa-eye" id="eye1"></i></button>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock" style="color:var(--primary)"></i></span>
          <input type="password" class="form-control" id="confirm" placeholder="Nhập lại mật khẩu" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('confirm','eye2')"><i class="fas fa-eye" id="eye2"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="registerBtn">
        <i class="fas fa-user-plus me-2"></i>Đăng ký
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted">Đã có tài khoản? <a href="/login.html" style="color:var(--primary);font-weight:600">Đăng nhập</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script>
function togglePwd(id, iconId) {
  const el = document.getElementById(id);
  const icon = document.getElementById(iconId);
  if (el.type === 'password') { el.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { el.type = 'password'; icon.className = 'fas fa-eye'; }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    document.getElementById('errorMsg').textContent = 'Mật khẩu xác nhận không khớp';
    document.getElementById('errorMsg').classList.remove('d-none');
    return;
  }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng ký...';

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password
    })
  });
  const data = await res.json();

  if (data.success) {
    window.location.href = '/';
  } else {
    document.getElementById('errorMsg').textContent = data.message;
    document.getElementById('errorMsg').classList.remove('d-none');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Đăng ký';
  }
});
</script>
</body>
</html>
